{% extends "admin/base_site.html" %}

{% block title %}گزارش مالی{% endblock %}

{% block content %}
<div id="content-main">
    <h1>گزارش مالی (خروجی PDF)</h1>
    <form method="post" style="max-width: 420px; margin-top: 20px;">
        {% csrf_token %}
        <div class="module aligned">
            {% for field in form %}
                <div class="form-row">
                    <div>
                        <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="errornote">{{ field.errors }}</p>
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>
        <div class="submit-row">
            <input type="submit" value="دریافت PDF" class="default">
        </div>
    </form>
</div>
{% endblock %}
