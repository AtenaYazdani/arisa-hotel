{% extends "admin/base_site.html" %}
{% block content %}
<h1>ارسال ایمیل به {{ subscribers|length }} مشترک</h1>
<form method="post">
    {% csrf_token %}
    {% for obj in subscribers %}
        <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="send_newsletter_email">
    <div class="module aligned">
        <div class="form-row">
            <div><label>موضوع:</label>{{ form.subject }}</div>
        </div>
        <div class="form-row">
            <div><label>متن:</label>{{ form.body }}</div>
        </div>
    </div>
    <div class="submit-row">
        <input type="submit" name="apply" value="ارسال ایمیل" class="default">
    </div>
</form>
{% endblock %}
