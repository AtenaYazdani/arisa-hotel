{% extends 'auth_base.html' %}
{% block title %}بازیابی رمز | آریسا{% endblock %}
{% block auth_content %}
<h2>بازیابی رمز عبور</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="auth-submit">ارسال لینک بازیابی</button>
</form>
<div class="auth-links">
    <p><a href="{% url 'accounts:login' %}">بازگشت به ورود</a></p>
</div>
{% endblock %}
