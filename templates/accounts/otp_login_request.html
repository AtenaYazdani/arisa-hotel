{% extends 'auth_base.html' %}
{% block title %}ورود با شماره تماس | آریسا{% endblock %}
{% block auth_content %}
<h2>ورود با کد پیامکی</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="auth-submit">ارسال کد</button>
</form>
<div class="auth-links">
    <p><a href="{% url 'accounts:login' %}">ورود با نام کاربری و رمز عبور</a></p>
</div>
{% endblock %}
