{% load static %}
<section class="hero page-hero-variant" style="background-image: linear-gradient(90deg, rgba(2,7,12,0.88) 0%, rgba(2,7,12,0.55) 35%, rgba(2,7,12,0.1) 65%, rgba(2,7,12,0) 100%), linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.7) 100%), url('{% static hero_image %}');">
    <div class="hero-content">
        <p class="hero-subtitle">{{ eyebrow }}</p>
        <h1 class="hero-brand-fa">{{ title }}</h1>
        <div class="hero-divider"><span></span><b>❖</b><span></span></div>
        <p class="hero-description">{{ description }}</p>
        {% if cta_text %}
            <a href="{{ cta_link|default:'#' }}" class="hero-cta"><span>←</span> {{ cta_text }}</a>
        {% endif %}
    </div>
</section>
